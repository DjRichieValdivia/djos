# DJOS: el micrófono de una webcam no es la entrada por defecto. WirePlumber elige por prioridad y la de una webcam
# suele ganarle a la interfaz de audio (la Scarlett, la consola DJ), que es con la que se graba o se toca. Si alguien
# elige la webcam en Configuración > Sonido, eso se respeta (lo que el usuario elige manda sobre la prioridad).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*", device.form-factor = "webcam" }
    ]
    actions = {
      update-props = {
        priority.session = 500
        priority.driver = 500
      }
    }
  }
]
