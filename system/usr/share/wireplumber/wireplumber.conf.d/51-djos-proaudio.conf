# DJOS: interfaces de audio USB de estudio en perfil "Pro Audio" (con DAWs y JACK: menos latencia, sin período
# extra de margen, todos los canales por separado). No se aplica a las consolas DJ.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Focusrite_Scarlett*" }
      { device.name = "~alsa_card.usb-Focusrite_Clarett*" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
]
