# DJOS: las salidas de las placas de sonido no se suspenden nunca. WirePlumber las cierra a los 5 s de silencio y las
# vuelve a abrir con el próximo sonido (un clic en una página, un aviso, un video): muchas placas, como la Focusrite
# Scarlett, hacen "pop" en los parlantes cada vez. Abiertas, el primer sonido además sale sin demora. Las entradas
# (micrófonos, la de la webcam) sí se suspenden: no hacen ruido al abrirse. No molesta a Richie DJ con "ALSA Direct":
# igual se la pide a PipeWire (ReserveDevice1) y PipeWire la suelta.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
