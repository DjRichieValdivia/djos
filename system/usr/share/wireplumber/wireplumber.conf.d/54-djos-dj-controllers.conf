# DJOS: controladoras DJ con placa de sonido propia. Pioneer / AlphaTheta DDJ-FLX10: 4 salidas (1-2 master, 3-4
# auriculares) y 10 entradas. Con el perfil de fábrica PipeWire la armaba como "surround 4.0" (frente / centro / LFE) y
# en los programas no aparecían master y auriculares; con "pro-audio" salen los canales tal cual (AUX0-3).
# (además, con "surround 4.0" PipeWire repartía el sonido estéreo del escritorio también al centro / LFE, o sea a los
# auriculares 3-4)
# La FLX10 sólo anda a 44,1 kHz. Con el reloj de PipeWire a 48 / 96 kHz el bloque se achica en proporción (256 a
# 96 kHz -> 64 a 44,1 kHz) y con el modo por interrupciones del perfil "pro-audio" esta placa USB perdía un bloque de
# cada dos: le llegaba la mitad del sonido (medido con el retorno del master por su entrada 1-2). Con el modo por
# temporizador de PipeWire (el de siempre en placas USB) llega entero.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-AlphaTheta_Corporation_DDJ-FLX10.*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "~alsa_(input|output).usb-AlphaTheta_Corporation_DDJ-FLX10.*" } ]
    actions = { update-props = { api.alsa.disable-tsched = false } }
  }
]
