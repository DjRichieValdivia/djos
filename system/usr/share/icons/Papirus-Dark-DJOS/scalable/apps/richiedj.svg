<!-- DJOS: ícono de Richie DJ en el tema de DJOS (un vinilo con la etiqueta azul); el de la app (hicolor) queda igual -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#2b2f36"/>
      <stop offset="0.92" stop-color="#16181c"/>
      <stop offset="1" stop-color="#0e1013"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.47" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.53" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aaeff"/>
      <stop offset="1" stop-color="#0a6ce8"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="29.2" fill="none" stroke="#6b717c" stroke-width="1.6"/>
  <g fill="none" stroke="#474c55" stroke-width="0.9">
    <circle cx="32" cy="32" r="25"/>
    <circle cx="32" cy="32" r="21.5"/>
    <circle cx="32" cy="32" r="18"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="url(#shine)"/>
  <circle cx="32" cy="32" r="12.5" fill="url(#label)"/>
  <circle cx="32" cy="32" r="12.5" fill="none" stroke="#9fd0ff" stroke-opacity="0.5" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="2.4" fill="#0e1013"/>
</svg>
