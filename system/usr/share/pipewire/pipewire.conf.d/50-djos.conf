# DJOS: audio profesional. 48 kHz fijos, se permiten buffers chicos para DAWs y programas JACK
# (Richie DJ con "ALSA Direct" no pasa por PipeWire: abre la placa directo).
# Frecuencia fija: con varias permitidas PipeWire reconfigura la placa cada vez que algo pide otra (el navegador a
# 48 kHz, un tema a 44,1 kHz…) y muchas placas hacen "pop"; así todo se convierte a la del equipo con la mejor
# calidad (resample.quality = 10). DJOS Center > Audio elige otra, o "seguir la frecuencia de lo que suena"
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}
