# DJOS: los perfiles de energía de Plasma (ícono de batería/energía) usan los perfiles de tuned de DJOS.
# optimizer-setup copia este archivo a /etc/tuned/ppd.conf (que es de tuned-ppd: el original se guarda en
# /var/lib/djos/backup y vuelve al desinstalar DJOS).
[main]
# DJOS arranca en "Rendimiento" (se puede cambiar desde el ícono de energía de Plasma)
default=performance
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
power-saver=powersave
balanced=djos-balanced
performance=djos

[battery]
balanced=balanced-battery
