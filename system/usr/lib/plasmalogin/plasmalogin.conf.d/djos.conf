# DJOS: fondo de la pantalla de inicio de sesión (Plasma Login Manager). Los colores, letras e íconos los toma de
# /etc/xdg/kdeglobals. Va en la carpeta de valores de fábrica (/usr/lib): probado en Fedora 44, el fondo del saludo
# NO toma lo que está en /etc/plasmalogin.conf.d. Si se elige otro fondo en Configuración > Pantalla de inicio de
# sesión, eso queda en /etc/plasmalogin.conf y manda sobre este archivo.
[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/DJOS/
