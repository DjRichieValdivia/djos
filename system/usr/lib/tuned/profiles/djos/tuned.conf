[main]
summary=DJOS: real-time audio, minimum latency
# latency-performance: procesador siempre a máxima velocidad y sin estados de reposo profundos (solo C1),
# lo recomendado para audio profesional sin cortes
include=latency-performance

[audio]
# el códec de sonido de la placa madre nunca se apaga (sin "pops" ni demora al empezar a sonar)
timeout=0

[vm]
# copiar un set a un pendrive para las CDJ: escribe de a poco y el pendrive se puede sacar enseguida
dirty_bytes = 1073741824
dirty_background_bytes = 268435456

[sysctl]
# la memoria bloqueada del audio (pistas cargadas) no se mueve de lugar para compactar
vm.compact_unevictable_allowed = 0
