# DJOS: menú de 3 segundos con DJOS (por defecto) y Windows, si está instalado en otro disco.
set timeout_style=menu
set timeout=3
if [ "$grub_platform" = "efi" ]; then
  insmod part_gpt
  insmod fat
  insmod chain
  if search --no-floppy --file --set=djos_win /EFI/Microsoft/Boot/bootmgfw.efi; then
    menuentry 'Windows' --class windows --id windows {
      insmod part_gpt
      insmod fat
      insmod chain
      search --no-floppy --file --set=root /EFI/Microsoft/Boot/bootmgfw.efi
      chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    }
  fi
fi
