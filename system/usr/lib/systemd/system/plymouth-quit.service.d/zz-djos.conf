# DJOS: después de una actualización del núcleo, akmods compila el driver de NVIDIA al arrancar (uno o dos minutos,
# antes de la pantalla de login). plasmalogin no se queda con la pantalla de arranque (como GDM), así que Plymouth
# se cerraba enseguida y quedaba una consola negra con "A start job is running…": ahora la pantalla de arranque de
# DJOS sigue hasta que akmods termina (y muestra su aviso "akmod: Building…"). Sin akmods instalado no cambia nada.
[Unit]
After=akmods.service
