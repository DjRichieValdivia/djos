# DJOS: nunca durante un set (recorre todos los discos, también los de música que Richie DJ está leyendo).
# "+": gig-guard tiene que ver /dev/cpu_dma_latency y los procesos del usuario (el servicio corre aislado:
# PrivateDevices, sin permisos para mirar otros procesos)
[Service]
ExecCondition=+/usr/libexec/djos/gig-guard
CPUWeight=idle
