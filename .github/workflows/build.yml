name: Build DJOS Optimizer

# Arma el RPM de DJOS Optimizer (noarch) en un contenedor fedora:44 y lo publica como imagen privada chiquita
# ghcr.io/<dueño>/djos-optimizer:<versión> y :latest (FROM scratch, /rpm/djos-optimizer.noarch.rpm, etiqueta
# org.djos.version). Con una etiqueta vX.Y.Z además sube el RPM y bootstrap/install.sh a un GitHub Release.
# La versión sale de packaging/VERSION: hay que subirla para que las PC instaladas tomen el cambio.

on:
  push:
    branches: [main, optimizer]
    tags: ["v*"]
    paths-ignore: ["README.md", "packaging/ARCHITECTURE.md"]
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release de las etiquetas
  packages: write   # imagen en ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          set -euo pipefail
          ver=$(tr -d '[:space:]' < packaging/VERSION)
          [[ $ver =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::packaging/VERSION must be x.y.z (it is '$ver')"; exit 1; }
          if [[ $GITHUB_REF == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "v$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaging/VERSION ($ver)"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/djos-optimizer" >> "$GITHUB_OUTPUT"

      - name: Check the scripts (bash -n, Python syntax, shellcheck; only errors fail)
        run: bash packaging/lint.sh

      - name: Build the RPM (fedora:44 container, rpmlint, dependency and file conflict checks)
        env:
          DJOS_OWNER: ${{ github.repository_owner }}
        run: sudo env DJOS_OWNER="$DJOS_OWNER" bash packaging/build-rpm.sh dist

      - name: Keep the RPM with this run
        uses: actions/upload-artifact@v4
        with:
          name: djos-optimizer-${{ steps.v.outputs.version }}
          path: |
            dist/*.rpm
            dist/rpmlint.txt
          if-no-files-found: error

      - name: Publish ${{ steps.v.outputs.image }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          set -euo pipefail
          ctx=$(mktemp -d)
          mkdir "$ctx/rpm"
          cp "dist/djos-optimizer-$VERSION-1.noarch.rpm" "$ctx/rpm/djos-optimizer.noarch.rpm"
          chmod 0644 "$ctx/rpm/djos-optimizer.noarch.rpm"
          printf 'FROM scratch\nCOPY rpm/ /rpm/\n' > "$ctx/Containerfile"
          sudo podman build \
            --label "org.djos.version=$VERSION" \
            --label "org.opencontainers.image.title=DJOS Optimizer" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$VERSION" "$ctx"
          printf '%s' "$TOKEN" | sudo podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # la misma versión con otro contenido no le llega a nadie: las PC comparan la versión
          if sudo skopeo inspect --no-tags "docker://$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION already exists and is being replaced. Installed PCs only update when packaging/VERSION goes up."
          fi
          # gzip: bootstrap/install.sh abre las capas con tar
          sudo podman push --compression-format gzip "$IMAGE:$VERSION"
          sudo podman tag "$IMAGE:$VERSION" "$IMAGE:latest"
          sudo podman push --compression-format gzip "$IMAGE:latest"
          sudo podman logout ghcr.io

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          rpm="dist/djos-optimizer-$VERSION-1.noarch.rpm"
          [ -f bootstrap/install.sh ] || { echo "::error::bootstrap/install.sh is missing"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$rpm" bootstrap/install.sh --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$rpm" bootstrap/install.sh \
              --title "DJOS Optimizer $VERSION" \
              --notes "DJOS Optimizer $VERSION for Fedora KDE Plasma Desktop 44 and newer. See README.md to install it."
          fi
